<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080a12"><link rel="manifest" href="/manifest.webmanifest"><title>JIGᶻ AGENT Store</title>
<style>
:root{--bg:#080a12;--panel:#111827;--panel2:#0d1320;--line:#28344d;--text:#f8fafc;--muted:#94a3b8;--pink:#ec4899;--purple:#7c3aed;--green:#22c55e}*{box-sizing:border-box}html{color-scheme:dark;scroll-behavior:smooth}body{margin:0;font-family:Arial,"Noto Sans Thai",sans-serif;background:radial-gradient(circle at 85% 0,rgba(124,58,237,.13),transparent 25%),var(--bg);color:var(--text);padding-bottom:78px}button,input,select{font:inherit}.hidden{display:none!important}.muted{color:var(--muted)}header{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:rgba(8,10,18,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}.brand{font-weight:900;letter-spacing:.04em}.version{display:inline-block;margin-top:5px;font-size:10px;padding:4px 8px;border-radius:999px;background:#7c3aed2e;color:#c4b5fd;border:1px solid #7c3aed59}.account{display:flex;align-items:center;gap:8px}.portal{position:relative;width:46px;height:46px;border:0;background:transparent;cursor:pointer;perspective:100px}.portal-orb{position:absolute;inset:7px;border-radius:50%;background:radial-gradient(circle at 34% 28%,#fff 0 7%,#b26cff 16%,#4f1ca3 52%,#12051f 82%);box-shadow:0 0 18px #8b5cf6}.portal-orb:after{content:"";position:absolute;left:-7px;top:10px;width:39px;height:13px;border:3px solid #f97371;border-left-color:#a855f7;border-right-color:#3b82f6;border-radius:50%;transform:rotate(-17deg)}.portal:hover .portal-orb{animation:planetflip .65s ease}.btn{border:0;border-radius:12px;padding:11px 14px;color:#fff;background:linear-gradient(90deg,var(--pink),var(--purple));font-weight:800;cursor:pointer}.btn2{border:1px solid var(--line);border-radius:12px;padding:10px 13px;color:#fff;background:var(--panel2);cursor:pointer}.wide{width:100%}main{max-width:1100px;margin:auto;padding:16px}.hero{display:block;padding:26px;border-radius:24px;background:radial-gradient(circle at 90% 15%,#ec489947,transparent 24%),radial-gradient(circle at 75% 75%,#7c3aed52,transparent 30%),linear-gradient(135deg,#111827,#17132f);border:1px solid #3a2f63}.hero h1{font-size:clamp(28px,5vw,46px);line-height:1.05;margin:8px 0}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.quick button{padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--panel);text-align:left;color:#fff}.quick b{display:block;margin-bottom:4px}.section{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:24px 0 10px}.section h2{margin:0}.toolbar{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}.toolbar input,.toolbar select{padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);color:#fff}.toolbar input{flex:1;min-width:220px}.toolbar select{min-width:145px}.status{display:flex;justify-content:space-between;gap:12px;margin:10px 0 14px}.dot{display:inline-block;width:8px;height:8px;margin-right:7px;border-radius:50%;background:var(--green);box-shadow:0 0 12px #22c55ecc}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card{position:relative;border:1px solid var(--line);border-radius:18px;background:var(--panel);overflow:hidden}.photo{aspect-ratio:1;background:#090d17;display:grid;place-items:center;color:#725d85}.photo img{width:100%;height:100%;object-fit:cover}.body{padding:12px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.card h3{margin:10px 0 6px;font-size:15px;min-height:36px}.tag,.stock{display:inline-flex;padding:4px 8px;border-radius:999px;font-size:10px}.tag{border:1px solid var(--line);color:#c4b5fd}.stock{background:#22c55e1f;color:#86efac}.stock.wait{background:#94a3b81f;color:#cbd5e1}.wish{position:absolute;top:9px;right:9px;z-index:2;width:38px;height:38px;border-radius:50%;border:1px solid #ffffff2e;background:#080a12c7;color:#fff;font-size:17px}.wish.active{color:#f9a8d4;background:#ec489940}.price{font-weight:900;margin:8px 0}.empty{grid-column:1/-1;padding:32px;border:1px dashed var(--line);border-radius:18px;text-align:center;color:var(--muted)}.bottom{position:fixed;z-index:30;bottom:0;left:50%;transform:translateX(-50%);width:min(1100px,100%);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:#080a12f7;border:1px solid var(--line);border-bottom:0}.bottom button{border:0;background:transparent;color:var(--muted)}.bottom button:first-child{color:#e9d5ff}.bottom small{display:block;margin-top:2px}.modal{position:fixed;inset:0;z-index:50;background:#000000c2;display:flex;align-items:center;justify-content:center;padding:18px}.sheet{width:min(700px,100%);max-height:90vh;overflow:auto;padding:18px;border-radius:24px;background:var(--panel);border:1px solid var(--line)}.modal-head{display:flex;justify-content:space-between;align-items:center}.close{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--panel2);color:#fff}.detail{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:16px}.detail-photo{aspect-ratio:1;border-radius:18px;overflow:hidden;background:#090d17}.detail-photo img{width:100%;height:100%;object-fit:cover}.cart-item{display:grid;grid-template-columns:1fr auto;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.qty{display:flex;align-items:center;gap:8px}.qty button{width:32px;height:32px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);color:#fff}.notice{padding:14px;border:1px solid #4c3a73;border-radius:14px;background:#17132f;color:#d8cbeb}.toast{position:fixed;left:50%;bottom:92px;z-index:80;transform:translate(-50%,20px);padding:12px 16px;border:1px solid var(--line);border-radius:14px;background:#111827;opacity:0;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}.warp{position:fixed;inset:0;z-index:100;background:#03000b;display:grid;place-items:center;overflow:hidden}.warp:before{content:"";position:absolute;width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 0 20px 5px #fff,0 0 55px 25px #7c3aed,0 0 130px 65px #4c1d95;animation:tunnel 3s ease-in forwards}.warp-core{text-align:center;z-index:1}.warp-core .portal-orb{position:relative;display:block;width:86px;height:86px;inset:auto;margin:auto;animation:planetflip .55s linear infinite}.warp-core p{margin-top:28px;font-weight:900;letter-spacing:.12em}.warp-core small{color:#c4b5fd}@keyframes planetflip{50%{transform:rotateY(90deg) scale(.86)}100%{transform:rotateY(180deg)}}@keyframes tunnel{0%{transform:scale(1);opacity:.9}75%{transform:scale(24);opacity:1}100%{transform:scale(70);opacity:0}}@media(max-width:760px){.quick{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.toolbar select{min-width:calc(50% - 5px);flex:1}.account-label{display:none}.detail{grid-template-columns:1fr}.portal{width:42px;height:42px}}@media(max-width:390px){.grid{grid-template-columns:1fr}.brand{font-size:14px}.btn2{padding:9px}}
</style></head><body>
<header><div><div class="brand">JIGᶻ AGENT Store</div><span class="version">STORE OS · CLOUD</span></div><div class="account"><button class="portal" type="button" onclick="openWarp()" aria-label="เปิดประตู"><span class="portal-orb"></span></button><button class="btn2" onclick="info('account')">👤 <span class="account-label">เข้าสู่ระบบ</span></button><button class="btn2" onclick="openCart()">🛒 <span id="cartCount">0</span></button></div></header>
<main><section class="hero"><div><span class="muted">JIGᶻ AGENT Shopping Experience</span><h1>ช้อปง่าย<br>ดูประวัติได้ทันที</h1><p class="muted">ค้นหา เลือกสินค้า และตรวจสอบข้อมูลได้จากหน้าเดียว</p></div></section>
<div class="quick"><button onclick="focusSearch()"><b>🔍 ค้นหาสินค้า</b><span class="muted">พิมพ์ชื่อหรือหมวดหมู่</span></button><button onclick="info('history')"><b>🧾 ประวัติคำสั่งซื้อ</b><span class="muted">ดูออเดอร์ย้อนหลัง</span></button><button onclick="info('tracking')"><b>📦 ติดตามสถานะ</b><span class="muted">เช็กสถานะออเดอร์ล่าสุด</span></button></div>
<section id="favoriteSection" class="hidden"><div class="section"><div><span class="muted">เก็บไว้ก่อน</span><h2>❤️ รายการโปรด</h2></div><button class="btn2" onclick="clearFavorites()">ล้างทั้งหมด</button></div><div id="favoriteGrid" class="grid"></div></section>
<div class="section"><div><span class="muted">Current catalog</span><h2>รายการสินค้า</h2></div></div><div class="toolbar"><input id="search" type="search" placeholder="ค้นหาสินค้า..."><select id="category"><option value="">ทุกหมวดหมู่</option></select><select id="stockFilter"><option value="">ทุกสถานะสต็อก</option><option value="ready">มีสินค้า</option><option value="wait">รอรีสต็อก</option></select><select id="sort"><option value="name">เรียงตามชื่อ</option><option value="priceAsc">ราคาน้อย → มาก</option><option value="priceDesc">ราคามาก → น้อย</option></select></div><div class="status"><span id="status"><i class="dot"></i>กำลังโหลดสินค้า...</span><span id="count" class="muted"></span></div><div id="productGrid" class="grid"></div></main>
<nav class="bottom"><button onclick="goHome()">🏠<small>สินค้า</small></button><button onclick="openCart()">🛒<small>ตะกร้า</small></button><button onclick="info('tracking')">📦<small>ติดตาม</small></button><button onclick="info('history')">🧾<small>ประวัติ</small></button><button onclick="location.href='https://line.me/R/ti/p/@jigz'">💬<small>ติดต่อ</small></button></nav><div id="modal" class="modal hidden"><div class="sheet"><div class="modal-head"><h2 id="modalTitle"></h2><button class="close" onclick="closeModal()">✕</button></div><div id="modalBody"></div></div></div><div id="toast" class="toast"></div><div id="warp" class="warp hidden"><div class="warp-core"><span class="portal-orb"></span><p>JIGᶻ KINGDOM</p><small>กำลังเปิดประตูวาร์ป · 3 วินาที</small></div></div>
<script>
const store={products:[],cart:local('jigz_cart',[]),favorites:local('jigz_favorites',[]),query:'',category:'',stock:'',sort:'name'};const money=new Intl.NumberFormat('th-TH',{style:'currency',currency:'THB',maximumFractionDigits:0});function local(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch{return d}}function save(k,v){localStorage.setItem(k,JSON.stringify(v))}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function load(){try{let r=await fetch('/api/products');if(!r.ok)r=await fetch('/products.json');if(!r.ok)throw 0;store.products=(await r.json()).products||[];[...new Set(store.products.map(p=>p.category))].sort((a,b)=>a.localeCompare(b,'th')).forEach(v=>document.querySelector('#category').insertAdjacentHTML('beforeend',`<option value="${esc(v)}">${esc(v)}</option>`));render();renderFavorites();document.querySelector('#status').innerHTML='<i class="dot"></i>ระบบสินค้าออนไลน์'}catch{document.querySelector('#status').textContent='โหลดข้อมูลไม่สำเร็จ';document.querySelector('#productGrid').innerHTML='<div class="empty">กรุณาลองใหม่</div>'}}
function rows(){let a=store.products.filter(p=>(!store.query||p.name.toLowerCase().includes(store.query)||p.category.toLowerCase().includes(store.query))&&(!store.category||p.category===store.category)&&(!store.stock||(store.stock==='ready'?p.stock!=null&&p.stock>0:p.stock==null||p.stock<=0)));a.sort((x,y)=>store.sort==='priceAsc'?(x.price??Infinity)-(y.price??Infinity):store.sort==='priceDesc'?(y.price??-1)-(x.price??-1):x.name.localeCompare(y.name,'th'));return a}
function card(p){const img=p.images?.[0]?`<img src="${esc(p.images[0])}" alt="${esc(p.name)}" loading="lazy" referrerpolicy="no-referrer">`:'JIGz',fav=store.favorites.includes(p.id),st=p.stock==null||p.stock<=0?'<span class="stock wait">รอรีสต็อก</span>':`<span class="stock">คงเหลือ ${esc(p.stock)} ${esc(p.unit)}</span>`;return `<article class="card"><button class="wish ${fav?'active':''}" onclick="favorite('${esc(p.id)}',event)">${fav?'♥':'♡'}</button><div class="photo" onclick="product('${esc(p.id)}')">${img}</div><div class="body"><span class="tag">${esc(p.category)}</span><h3>${esc(p.name)}</h3><div class="price">${p.price==null?'สอบถามข้อมูล':money.format(p.price)+' / '+esc(p.unit)}</div><div class="row">${st}<button class="btn2" onclick="product('${esc(p.id)}')">ดู</button></div></div></article>`}
function render(){const a=rows();document.querySelector('#count').textContent=a.length+' รายการ';document.querySelector('#productGrid').innerHTML=a.length?a.map(card).join(''):'<div class="empty">ไม่พบรายการ</div>'}function renderFavorites(){const a=store.favorites.map(id=>store.products.find(p=>p.id===id)).filter(Boolean);document.querySelector('#favoriteSection').classList.toggle('hidden',!a.length);document.querySelector('#favoriteGrid').innerHTML=a.map(card).join('')}function favorite(id,e){e.stopPropagation();store.favorites=store.favorites.includes(id)?store.favorites.filter(x=>x!==id):[id,...store.favorites];save('jigz_favorites',store.favorites);render();renderFavorites()}function clearFavorites(){store.favorites=[];save('jigz_favorites',[]);render();renderFavorites()}
function product(id){const p=store.products.find(x=>x.id===id);if(!p)return;const img=p.images?.[0]?`<img src="${esc(p.images[0])}" alt="${esc(p.name)}">`:'',wait=p.stock==null||p.stock<=0;modal(p.name,`<div class="detail"><div class="detail-photo">${img}</div><div><span class="tag">${esc(p.category)}</span><p class="muted">รหัส ${esc(p.id)}</p><h3>${p.price==null?'สอบถามข้อมูล':money.format(p.price)+' / '+esc(p.unit)}</h3><p>${wait?'สินค้ารอการรีสต็อก':'คงเหลือ '+esc(p.stock)+' '+esc(p.unit)}</p><button class="btn wide" ${wait?'disabled':''} onclick="add('${esc(p.id)}')">${wait?'รอรีสต็อก':'เพิ่มลงตะกร้า'}</button></div></div>`)}function add(id){const p=store.products.find(x=>x.id===id);if(!p||!p.stock)return;const l=store.cart.find(x=>x.id===id);l?l.qty++:store.cart.push({id,qty:1});save('jigz_cart',store.cart);updateCart();closeModal();toastMsg('เพิ่มลงตะกร้าแล้ว')}function updateCart(){cartCount.textContent=store.cart.reduce((s,x)=>s+x.qty,0)}function qty(id,d){const l=store.cart.find(x=>x.id===id);if(!l)return;l.qty+=d;if(l.qty<=0)store.cart=store.cart.filter(x=>x.id!==id);save('jigz_cart',store.cart);updateCart();openCart()}
function openCart(){const a=store.cart.map(line=>({line,p:store.products.find(p=>p.id===line.id)})).filter(x=>x.p),total=a.reduce((s,x)=>s+(x.p.price||0)*x.line.qty,0);modal('ตะกร้าของฉัน',a.length?a.map(x=>`<div class="cart-item"><div><b>${esc(x.p.name)}</b><div class="muted">${money.format((x.p.price||0)*x.line.qty)}</div></div><div class="qty"><button onclick="qty('${esc(x.p.id)}',-1)">−</button><b>${x.line.qty}</b><button onclick="qty('${esc(x.p.id)}',1)">+</button></div></div>`).join('')+`<h3 class="row"><span>รวม</span><span>${money.format(total)}</span></h3><div class="notice">ระบบยืนยันคำสั่งซื้อจะเปิดหลังตั้งค่าบัญชีสมาชิกและความปลอดภัยเรียบร้อย</div>`:'<div class="empty">ยังไม่มีสินค้าในตะกร้า</div>')}
function info(t){const x={account:['เข้าสู่ระบบสมาชิก','กำลังเชื่อมระบบสมาชิกกับ Cloudflare'],history:['ประวัติคำสั่งซื้อ','ระบบประวัติจะเปิดหลังระบบสมาชิกพร้อม'],tracking:['ติดตามสถานะ','ระบบติดตามกำลังเชื่อมฐานข้อมูล']}[t];modal(x[0],`<div class="notice" style="margin-top:16px">${x[1]}</div>`)}function modal(t,h){document.querySelector('#modalTitle').textContent=t;document.querySelector('#modalBody').innerHTML=h;document.querySelector('#modal').classList.remove('hidden')}function closeModal(){document.querySelector('#modal').classList.add('hidden')}function focusSearch(){const el=document.querySelector('#search');el.focus();el.scrollIntoView({behavior:'smooth',block:'center'})}function goHome(){closeModal();scrollTo({top:0,behavior:'smooth'})}function toastMsg(t){const el=document.querySelector('#toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1600)}
function openWarp(){const el=document.querySelector('#warp');if(!el.classList.contains('hidden'))return;el.classList.remove('hidden');document.body.style.overflow='hidden';setTimeout(()=>location.assign('/admin'),3000)}
document.querySelector('#search').oninput=e=>{store.query=e.target.value.trim().toLowerCase();render()};document.querySelector('#category').onchange=e=>{store.category=e.target.value;render()};document.querySelector('#stockFilter').onchange=e=>{store.stock=e.target.value;render()};document.querySelector('#sort').onchange=e=>{store.sort=e.target.value;render()};document.querySelector('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};updateCart();load();
</script></body></html>
